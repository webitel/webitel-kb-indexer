name: PR (webitel-kb-indexer)
run-name: "webitel-kb-indexer@pr${{ github.event.pull_request.number }}#${{ github.run_number }} - ${{ github.event.pull_request.title }}"

on:
  pull_request:

permissions: { contents: read }
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare
    uses: webitel/reusable-workflows/.github/workflows/python-prepare.yml@v2
    permissions:
      contents: read
      pull-requests: read
      id-token: write

    with:
      development-branch: ${{ github.event.repository.default_branch }}
      triggered-branch: ${{ github.event.pull_request.base.ref }}
      arch: ${{ vars.BUILD_ARCH }}
      codename: ${{ vars.DEB_CODENAME }}

  checks:
    name: Checks
    needs: [ prepare ]
    uses: webitel/reusable-workflows/.github/workflows/python-checks.yml@v2
    permissions:
      contents: read
      actions: read
      security-events: write

    with:
      changes: ${{ needs.prepare.outputs.changes }}

  compile:
    name: Build
    needs: [ prepare ]
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.prepare.outputs.arch-matrix) }}

    uses: webitel/reusable-workflows/.github/workflows/python-build.yml@v2
    with:
      arch: ${{ matrix.arch }}
      version: ${{ needs.prepare.outputs.version }}
      version-build: ${{ github.run_number }}
      build-timestamp: ${{ needs.prepare.outputs.build-timestamp }}
      build-info: kb_indexer._build_info
      prerelease: dev~pr${{ github.event.pull_request.number }}
      package-name: webitel-kb-indexer
      package-description: ${{ github.event.repository.description }}
      package-contents: |
        src=deploy/systemd/webitel-kb-indexer.service dst=/etc/systemd/system/webitel-kb-indexer.service type=config
        src=.env.example dst=/etc/default/webitel-kb-indexer type=config mode=0640
        

      package-depends: 
      scripts: |
        postinstall: deploy/debian/postinst.sh
        preremove: deploy/debian/prerm.sh
        postremove: deploy/debian/postrm.sh
        
