[project]
name = "webitel-kb-indexer"
version = "0.1.0"
description = "Webitel Knowledge Base indexer: turns article versions into chunks and embeddings"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]

[project.scripts]
kb-indexer = "kb_indexer.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_indexer"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "B", "C4", "DTZ", "E", "ERA", "F", "G", "I", "LOG", "N",
    "PIE", "PL", "PT", "PTH", "RET", "RUF", "S", "SIM", "T20", "TID", "UP", "W",
]
ignore = [
    "ANN401",  # a deliberate Any is sometimes the honest type
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "ARG001", "ARG002", "PLR2004", "S101", "S104", "SLF001"]

[tool.ruff.lint.isort]
known-first-party = ["kb_indexer"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
