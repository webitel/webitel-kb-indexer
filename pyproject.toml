[project]
name = "webitel-kb-indexer"
version = "0.1.0"
description = "Webitel Knowledge Base indexer: turns article versions into chunks and embeddings"
requires-python = ">=3.11"

dependencies = [
    "pika>=1.3,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "grpcio>=1.83.1,<2",
    "protobuf>=7.36.1,<8",
    "httpx>=0.28,<1",
]

[project.scripts]
kb-indexer = "kb_indexer.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-grpcio>=1.83,<2",
    "types-protobuf>=7.35,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_indexer"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
# Generated by protoc: not ours to format, and regenerated verbatim.
extend-exclude = ["*_pb2.py", "*_pb2.pyi", "*_pb2_grpc.py", "*_pb2_grpc.pyi"]

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "B", "C4", "DTZ", "E", "ERA", "F", "G", "I", "LOG", "N",
    "PIE", "PL", "PT", "PTH", "RET", "RUF", "S", "SIM", "T20", "TID", "UP", "W",
]
ignore = [
    "ANN401",  # a deliberate Any is sometimes the honest type
]

[tool.ruff.lint.per-file-ignores]
# RUF001: article text in this product is Cyrillic, and the fixtures have to be
# real text rather than transliterated Latin.
# S105: a fixture token is not a leaked secret.
"tests/*" = ["ANN", "ARG001", "ARG002", "PLR2004", "RUF001", "S101", "S104", "S105", "SLF001"]

[tool.ruff.lint.isort]
known-first-party = ["kb_indexer"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true
# The generated modules are described by the .pyi files beside them.
exclude = "_pb2(_grpc)?\\.py$"

[[tool.mypy.overrides]]
module = "pika.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
